version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 8
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      next-react:
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next
          - "@next/*"
      prisma:
        patterns:
          - prisma
          - "@prisma/*"
      dev-types:
        dependency-type: development
        patterns:
          - "@types/*"
          - typescript
          - eslint
          - tailwindcss
          - "@tailwindcss/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: ci
